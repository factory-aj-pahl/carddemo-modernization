name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check, COBOL syntax, docs, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARDDEMO_REQUIRE_COBC: "1"
      PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install GnuCOBOL and dev tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnucobol
          pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run checks (timed)
        run: |
          echo "| Check | Seconds | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|:--|--:|:--|" >> "$GITHUB_STEP_SUMMARY"
          status=0
          for target in lint-python typecheck lint syntax docs-check coverage; do
            echo "::group::make $target"
            start=$(date +%s)
            if make "$target"; then result=pass; else result=FAIL; status=1; fi
            echo "::endgroup::"
            echo "| make $target | $(( $(date +%s) - start )) | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
