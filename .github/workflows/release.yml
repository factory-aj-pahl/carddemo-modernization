name: Release

# Push a tag such as v1.2.0 to publish a GitHub release. Notes are generated from the
# merged pull requests since the previous tag, grouped by label (.github/release.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Package sources
        run: |
          git archive --format=tar.gz --prefix="carddemo-${GITHUB_REF_NAME}/" \
            -o "carddemo-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "carddemo-${GITHUB_REF_NAME}.tar.gz" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
