# Test database settings (test-support is a test-scoped dependency; these override module defaults).
# CARDDEMO_TEST_DB selects a scratch database so parallel builds do not share one (default carddemo_test).
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=${CARDDEMO_TEST_DB:carddemo_test};encrypt=true;trustServerCertificate=true
spring.datasource.username=carddemo_app
spring.datasource.password=${CARDDEMO_DB_PASSWORD}
spring.flyway.clean-disabled=false
spring.main.banner-mode=off
logging.level.root=WARN
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=carddemo
spring.rabbitmq.virtual-host=carddemo
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
carddemo.security.bcrypt-cost=4
