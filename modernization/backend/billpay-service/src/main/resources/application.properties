# Stand-alone bill payment service. Shares the CardDemo database with the online API.
server.address=127.0.0.1
server.port=${SERVER_PORT:8091}
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.application.name=carddemo-billpay-service
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=${CARDDEMO_DB:carddemo};encrypt=true;trustServerCertificate=true
spring.datasource.username=carddemo_app
spring.datasource.password=${CARDDEMO_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health
# Only Bill Payment is deployed here; the other main-menu options show "not installed".
carddemo.features.disabled-programs=COACTVWC,COACTUPC,COCRDLIC,COCRDSLC,COCRDUPC,COTRN00C,COTRN01C,COTRN02C,CORPT00C,COPAUS0C,COUSR00C,COUSR01C,COUSR02C,COUSR03C,COTRTLIC,COTRTUPC
