# Batch jar. Standard output carries only job SYSOUT; application logs go to a file.
spring.application.name=carddemo-batch
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=${CARDDEMO_DB:carddemo};encrypt=true;trustServerCertificate=true
spring.datasource.username=carddemo_app
spring.datasource.password=${CARDDEMO_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
logging.threshold.console=OFF
logging.file.name=${CARDDEMO_LOG_DIR:${java.io.tmpdir}}/carddemo-batch.log
