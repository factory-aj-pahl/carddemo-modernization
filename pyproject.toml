[project]
name = "carddemo-tooling"
version = "0.1.0"
description = "Static analysis, documentation, and GnuCOBOL test tooling for the CardDemo mainframe sources"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --durations=10"
markers = [
    "cobc: compiles or runs COBOL with GnuCOBOL; skipped when cobc is missing unless CARDDEMO_REQUIRE_COBC=1",
]

[tool.coverage.run]
source = ["tools/carddemo"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["app", "samples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.10"
files = ["tools/carddemo"]
strict = true
warn_unreachable = true
